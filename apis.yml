name: Blavity
description: >-
  Blavity Inc. is a Black-owned digital media and technology company founded in
  2014 by Morgan DeBaun, operating a portfolio of premium content brands and
  events for Black millennials and Gen Z around culture, technology, travel, and
  lifestyle. Its properties include Blavity.com (news and culture), AfroTech (the
  largest Black tech conference and media brand), Travel Noire (travel), Shadow
  and Act (film and entertainment), and 21Ninety (women's lifestyle). Blavity Inc.
  monetizes through advertising, branded content, events, and its Blavity Media
  Group agency. It is a privately held company backed by investors including
  500 Global and GV, and does not currently publish a public developer API,
  developer portal, or machine-readable API specifications. This profile tracks
  Blavity as a company in the API Evangelist network.
